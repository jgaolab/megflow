<polyline points="490.0,984 490.0,1025" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="490.0,1127 490.0,1180" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="1315" width="760" height="96" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="1345" font-size="17" class="box-title" text-anchor="middle">Epoch generation</text>
<text x="132" y="1372" font-size="14" class="box-text" text-anchor="start">Conditional for meg_epochs/meg_all: task events by find_events or</text>
<text x="132" y="1391" font-size="14" class="box-text" text-anchor="start">BIDS events.tsv, resting fixed windows, reject_by_annotation,</text>
<text x="132" y="1410" font-size="14" class="box-text" text-anchor="start">optional autoreject/interpolate/drop bads</text>
<polyline points="490.0,1274 490.0,1315" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="950" y="260" width="690" height="94" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1295.0" y="290" font-size="17" class="box-title" text-anchor="middle">Anatomy inputs</text>
<text x="972" y="317" font-size="14" class="box-text" text-anchor="start">Existing SUBJECTS_DIR, BIDS T1w import, non-BIDS NIfTI, DICOM</text>
<text x="972" y="336" font-size="14" class="box-text" text-anchor="start">conversion, or pseudo-MRI from MEG digitization points</text>
<rect x="950" y="410" width="690" height="100" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1295.0" y="440" font-size="17" class="box-title" text-anchor="middle">Pseudo-MRI option</text>
<text x="972" y="467" font-size="14" class="box-text" text-anchor="start">mni_icbm152_nlin_sym_09a template, FIF</text>
<text x="972" y="486" font-size="14" class="box-text" text-anchor="start">digitization/headshape, pseudo T1 NIfTI and metadata</text>
<rect x="950" y="560" width="690" height="104" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1295.0" y="590" font-size="17" class="box-title" text-anchor="middle">Structural reconstruction</text>
<text x="972" y="617" font-size="14" class="box-text" text-anchor="start">FreeSurfer recon-all, DeepPrep anatomy-only flow, resume-safe</text>
<text x="972" y="636" font-size="14" class="box-text" text-anchor="start">FreeSurfer continuation, or reused existing anatomy</text>
<rect x="950" y="720" width="690" height="100" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1295.0" y="750" font-size="17" class="box-title" text-anchor="middle">Head surface and BEM</text>
<text x="972" y="777" font-size="14" class="box-text" text-anchor="start">mkheadsurf/seghead, watershed BEM, ico/conductivity settings,</text>
<text x="972" y="796" font-size="14" class="box-text" text-anchor="start">surface and volume source spaces</text>
<polyline points="1295.0,354 1295.0,410" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1295.0,510 1295.0,560" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1295.0,664 1295.0,720" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1780" y="560" width="690" height="96" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="2125.0" y="590" font-size="17" class="box-title" text-anchor="middle">Noise covariance</text>
<text x="1802" y="617" font-size="14" class="box-text" text-anchor="start">covar_type=epochs baseline windows or covar_type=raw paired</text>
<text x="1802" y="636" font-size="14" class="box-text" text-anchor="start">task/raw_covariance_task_id; optional plots</text>
<rect x="1780" y="705" width="690" height="102" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="2125.0" y="735" font-size="17" class="box-title" text-anchor="middle">Coregistration</text>
<text x="1802" y="762" font-size="14" class="box-text" text-anchor="start">Clean raw plus FreeSurfer subject; fiducials/headshape/HPI,</text>
<text x="1802" y="781" font-size="14" class="box-text" text-anchor="start">ICP and fine ICP weights, coreg-trans.fif and distance QC</text>
<rect x="1780" y="860" width="690" height="94" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="2125.0" y="890" font-size="17" class="box-title" text-anchor="middle">Forward solution</text>
<text x="1802" y="917" font-size="14" class="box-text" text-anchor="start">Epoch file, transform, BEM, source space, fwd_epoch_label,</text>
<text x="1802" y="936" font-size="14" class="box-text" text-anchor="start">MEG-only forward model and head-model figures</text>
<rect x="1780" y="1005" width="690" height="110" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="2125.0" y="1035" font-size="17" class="box-title" text-anchor="middle">Source localization</text>
<text x="1802" y="1062" font-size="14" class="box-text" text-anchor="start">src_type=epochs or raw; source_methods include</text>
<text x="1802" y="1081" font-size="14" class="box-text" text-anchor="start">MNE/dSPM/sLORETA/eLORETA and LCMV; STC files and brain figures</text>
<polyline points="2125.0,656 2125.0,705" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="2125.0,807 2125.0,860" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="2125.0,954 2125.0,1005" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
