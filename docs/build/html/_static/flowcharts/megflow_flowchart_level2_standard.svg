<polyline points="870,1363 1780,907" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="820" y="1390" width="540" height="120" rx="14" fill="#fff1c7" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1090.0" y="1420" font-size="17" class="box-title" text-anchor="middle">Data derivatives</text>
<text x="842" y="1447" font-size="14" class="box-text" text-anchor="start">preprocessed raw, QC summaries,</text>
<text x="842" y="1466" font-size="14" class="box-text" text-anchor="start">bad-channel/segment annotations, ICA</text>
<text x="842" y="1485" font-size="14" class="box-text" text-anchor="start">model/labels, clean raw, epochs, covariance,</text>
<text x="842" y="1504" font-size="14" class="box-text" text-anchor="start">trans, forward, source outputs</text>
<rect x="1430" y="1390" width="540" height="120" rx="14" fill="#fff1c7" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1700.0" y="1420" font-size="17" class="box-title" text-anchor="middle">Static HTML report</text>
<text x="1452" y="1447" font-size="14" class="box-text" text-anchor="start">Dataset dashboard, subject/recording pages,</text>
<text x="1452" y="1466" font-size="14" class="box-text" text-anchor="start">workflow diagram, alarms, QA figures, packaged</text>
<text x="1452" y="1485" font-size="14" class="box-text" text-anchor="start">sidecars, task logs</text>
<rect x="2040" y="1390" width="430" height="120" rx="14" fill="#fff1c7" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="2255.0" y="1420" font-size="17" class="box-title" text-anchor="middle">Interactive and corpus reports</text>
<text x="2062" y="1447" font-size="14" class="box-text" text-anchor="start">Streamlit review/edit viewer,</text>
<text x="2062" y="1466" font-size="14" class="box-text" text-anchor="start">report-only regeneration,</text>
<text x="2062" y="1485" font-size="14" class="box-text" text-anchor="start">cross-dataset corpus dashboard</text>
<polyline points="490,1411 820,1450" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
