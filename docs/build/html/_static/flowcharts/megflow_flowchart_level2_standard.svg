<text x="1290.0" y="1609.5" font-size="18" class="box-title" text-anchor="middle">Workflow infrastructure: Nextflow process DAG, task-level cache/resume, sidecar hash invalidation, trace/report/timeline logs, Docker/Singularity/SIF, local and</text>
<text x="1290.0" y="1632.5" font-size="18" class="box-title" text-anchor="middle">server/HPC execution, lenient/strict profiles</text>
