  </filter>
</defs>
<style>
  .title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; fill: #17324a; }
  .subtitle { font-family: Arial, Helvetica, sans-serif; font-weight: 400; fill: #516170; }
  .lane { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .5px; fill: #17324a; text-transform: uppercase; }
  .box-title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; fill: #1f2f3a; }
  .box-text { font-family: Arial, Helvetica, sans-serif; font-weight: 400; fill: #263946; }
  .legend { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #263946; }
  .caption { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-style: italic; fill: #555; }
</style>
<rect x="0" y="0" width="2600" height="1750" fill="#f7fafb"/>
<text x="90" y="68" font-size="42" class="title" text-anchor="start">MEGFlow stages and selectable modules</text>
<text x="90" y="105" font-size="20" class="subtitle" text-anchor="start">Level 2: standard view with processing lanes and major selectable modules.</text>
<rect x="1980" y="42" width="46" height="22" rx="5" fill="#d9ecff" stroke="#405867" stroke-width="1.2"/>
<text x="2040" y="59" font-size="18" class="legend" text-anchor="start">Mandatory / typical core</text>
<rect x="1980" y="78" width="46" height="22" rx="5" fill="#e4f4ec" stroke="#405867" stroke-width="1.2"/>
<text x="2040" y="95" font-size="18" class="legend" text-anchor="start">Optional or conditional</text>
<rect x="1980" y="114" width="46" height="22" rx="5" fill="#fff1c7" stroke="#405867" stroke-width="1.2"/>
<text x="2040" y="131" font-size="18" class="legend" text-anchor="start">Outputs / reporting</text>
<rect x="90" y="145" width="760" height="36" rx="18" fill="#cfe5fa" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="470.0" y="169" font-size="18" class="lane" text-anchor="middle">MANDATORY / TYPICAL MEG CORE</text>
<rect x="930" y="145" width="730" height="36" rx="18" fill="#d8efe5" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="1295.0" y="169" font-size="18" class="lane" text-anchor="middle">ANATOMY AND HEAD MODEL</text>
<rect x="1760" y="145" width="720" height="36" rx="18" fill="#d8efe5" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="2120.0" y="169" font-size="18" class="lane" text-anchor="middle">SOURCE RECONSTRUCTION</text>
<rect x="860" y="1325" width="920" height="36" rx="18" fill="#ffe9ad" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="1320.0" y="1349" font-size="18" class="lane" text-anchor="middle">OUTPUTS / REPORTING</text>
<rect x="110" y="220" width="760" height="78" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="250" font-size="17" class="box-title" text-anchor="middle">Inputs and dataset expansion</text>
<text x="132" y="277" font-size="14" class="box-text" text-anchor="start">Single dataset or corpus root; BIDS or raw MEG;</text>
<text x="132" y="296" font-size="14" class="box-text" text-anchor="start">subject/session/task/run filters; raw suffix include/exclude</text>
<rect x="110" y="330" width="760" height="78" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="360" font-size="17" class="box-title" text-anchor="middle">MEG import and indexing</text>
<text x="132" y="387" font-size="14" class="box-text" text-anchor="start">import_meg_dataset writes imported_meg_data.txt for each recording</text>
<rect x="110" y="445" width="760" height="92" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="475" font-size="17" class="box-title" text-anchor="middle">NormMEG-QC and NMDQ score</text>
<text x="132" y="502" font-size="14" class="box-text" text-anchor="start">Optional scoring and QC gate; vendor/category/scope,</text>
<text x="132" y="521" font-size="14" class="box-text" text-anchor="start">reference-aligned preprocessing, summary/component/family-score plots</text>
<rect x="110" y="585" width="760" height="94" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="615" font-size="17" class="box-title" text-anchor="middle">Basic continuous preprocessing</text>
<text x="132" y="642" font-size="14" class="box-text" text-anchor="start">OSL-Ephys chain: optional Maxwell/tSSS, band-pass filter, notch</text>
<text x="132" y="661" font-size="14" class="box-text" text-anchor="start">filter, resample; dataset-specific overrides</text>
<rect x="110" y="730" width="760" height="106" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="760" font-size="17" class="box-title" text-anchor="middle">Artifact detection</text>
<text x="132" y="787" font-size="14" class="box-text" text-anchor="start">BadChnNet then BadSegNet, plus PyPREP, PSD, OSL, and MNE;</text>
<text x="132" y="806" font-size="14" class="box-text" text-anchor="start">sidecars, provenance, mask heatmap, optional detailed images</text>
<rect x="110" y="890" width="760" height="94" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="920" font-size="17" class="box-title" text-anchor="middle">ICA fitting</text>
<text x="132" y="947" font-size="14" class="box-text" text-anchor="start">Fits ICA on preprocessed raw; bad annotations excluded from fitting;</text>
<text x="132" y="966" font-size="14" class="box-text" text-anchor="start">optional explained variance figures</text>
<rect x="110" y="1025" width="760" height="102" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="1055" font-size="17" class="box-title" text-anchor="middle">ICA component labeling</text>
<text x="132" y="1082" font-size="14" class="box-text" text-anchor="start">MNE ECG/EOG/muscle scores, MEGNet labels, and rule/template</text>
<text x="132" y="1101" font-size="14" class="box-text" text-anchor="start">classifiers; writes marked_components.txt and score JSON</text>
<rect x="110" y="1180" width="760" height="94" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="490.0" y="1210" font-size="17" class="box-title" text-anchor="middle">Apply ICA</text>
<text x="132" y="1237" font-size="14" class="box-text" text-anchor="start">Applies marked components and preserves bad-channel/bad-segment</text>
<text x="132" y="1256" font-size="14" class="box-text" text-anchor="start">metadata in cleaned continuous raw</text>
<polyline points="490.0,298 490.0,330" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="490.0,408 490.0,445" fill="none" stroke="#405867" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
