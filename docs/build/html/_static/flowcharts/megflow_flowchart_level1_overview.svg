<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 z" fill="#405867"/>
  </marker>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#334155" flood-opacity="0.11"/>
  </filter>
</defs>
<style>
  .title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; fill: #17324a; }
  .subtitle { font-family: Arial, Helvetica, sans-serif; font-weight: 400; fill: #516170; }
  .lane { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .5px; fill: #17324a; text-transform: uppercase; }
  .box-title { font-family: Arial, Helvetica, sans-serif; font-weight: 800; fill: #1f2f3a; }
  .box-text { font-family: Arial, Helvetica, sans-serif; font-weight: 400; fill: #263946; }
  .legend { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #263946; }
  .caption { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-style: italic; fill: #555; }
</style>
<rect x="0" y="0" width="2200" height="1480" fill="#f7fafb"/>
<text x="90" y="68" font-size="42" class="title" text-anchor="start">MEGFlow stages and selectable modules</text>
<text x="90" y="105" font-size="20" class="subtitle" text-anchor="start">Level 1: overview of mandatory core, optional branches, and reporting outputs derived from the Nextflow DAG.</text>
<rect x="1580" y="42" width="46" height="22" rx="5" fill="#d9ecff" stroke="#405867" stroke-width="1.2"/>
<text x="1640" y="59" font-size="18" class="legend" text-anchor="start">Mandatory / typical core</text>
<rect x="1580" y="78" width="46" height="22" rx="5" fill="#e4f4ec" stroke="#405867" stroke-width="1.2"/>
<text x="1640" y="95" font-size="18" class="legend" text-anchor="start">Optional or conditional</text>
<rect x="1580" y="114" width="46" height="22" rx="5" fill="#fff1c7" stroke="#405867" stroke-width="1.2"/>
<text x="1640" y="131" font-size="18" class="legend" text-anchor="start">Outputs / reporting</text>
<rect x="90" y="145" width="690" height="36" rx="18" fill="#cfe5fa" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="435.0" y="169" font-size="18" class="lane" text-anchor="middle">MANDATORY / TYPICAL CORE</text>
<rect x="865" y="145" width="870" height="36" rx="18" fill="#d8efe5" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="1300.0" y="169" font-size="18" class="lane" text-anchor="middle">OPTIONAL / CONDITIONAL MODULES</text>
<rect x="980" y="1065" width="820" height="36" rx="18" fill="#ffe9ad" stroke="#405867" stroke-width="1.5" opacity="0.85"/>
<text x="1390.0" y="1089" font-size="18" class="lane" text-anchor="middle">OUTPUTS / REPORTING</text>
<rect x="100" y="210" width="520" height="92" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="360.0" y="251.5" font-size="18" class="box-title" text-anchor="middle">Inputs: MEG files, metadata, optional T1w MRI, optional</text>
<text x="360.0" y="274.5" font-size="18" class="box-title" text-anchor="middle">noise recordings</text>
<rect x="120" y="380" width="660" height="78" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="450.0" y="426.5" font-size="19" class="box-title" text-anchor="middle">MEG import and indexing</text>
<rect x="120" y="500" width="660" height="88" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="450.0" y="551.0" font-size="18" class="box-title" text-anchor="middle">Continuous MEG preprocessing: filtering, notch, resampling</text>
<rect x="120" y="630" width="660" height="88" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="450.0" y="681.0" font-size="18" class="box-title" text-anchor="middle">Artifact detection: bad channels and bad segments</text>
<rect x="120" y="760" width="660" height="88" rx="14" fill="#d9ecff" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="450.0" y="811.0" font-size="18" class="box-title" text-anchor="middle">ICA fit, component labeling, and cleaned continuous raw</text>
<rect x="120" y="890" width="660" height="88" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="450.0" y="940.5" font-size="17" class="box-title" text-anchor="middle">Epoching when selected: task events or resting windows</text>
<rect x="890" y="300" width="650" height="86" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1215.0" y="338.5" font-size="17" class="box-title" text-anchor="middle">Structural MRI branch: existing anatomy, FreeSurfer, DeepPrep, or</text>
<text x="1215.0" y="360.5" font-size="17" class="box-title" text-anchor="middle">Pseudo-MRI</text>
<rect x="890" y="430" width="650" height="86" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1215.0" y="479.5" font-size="17" class="box-title" text-anchor="middle">Head surfaces, BEM, and source space/model construction</text>
<rect x="1580" y="520" width="520" height="80" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1840.0" y="566.0" font-size="16" class="box-title" text-anchor="middle">Covariance: baseline epochs or paired raw/noise recording</text>
<rect x="1580" y="640" width="520" height="80" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1840.0" y="686.5" font-size="17" class="box-title" text-anchor="middle">MEG-MRI coregistration</text>
<rect x="1580" y="760" width="520" height="80" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1840.0" y="806.5" font-size="17" class="box-title" text-anchor="middle">Forward solution</text>
<rect x="1580" y="880" width="520" height="86" rx="14" fill="#e4f4ec" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1840.0" y="929.0" font-size="16" class="box-title" text-anchor="middle">Source reconstruction: minimum norm or beamformer methods</text>
<rect x="860" y="1135" width="620" height="96" rx="14" fill="#fff1c7" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1170.0" y="1178.5" font-size="17" class="box-title" text-anchor="middle">Derivative outputs: preprocessed raw, sidecars, ICA, epochs,</text>
<text x="1170.0" y="1200.5" font-size="17" class="box-title" text-anchor="middle">covariance, trans, forward, source</text>
<rect x="1540" y="1135" width="520" height="96" rx="14" fill="#fff1c7" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1800.0" y="1178.5" font-size="17" class="box-title" text-anchor="middle">Reports: static HTML, interactive Streamlit, report-only</text>
<text x="1800.0" y="1200.5" font-size="17" class="box-title" text-anchor="middle">regeneration, corpus dashboard</text>
<rect x="105" y="1285" width="1990" height="80" rx="14" fill="#edf3f7" stroke="#405867" stroke-width="2.2" opacity="1.0" filter="url(#shadow)"/>
<text x="1100.0" y="1332.5" font-size="19" class="box-title" text-anchor="middle">Workflow infrastructure: Nextflow DAG, task hashes, cache/resume, trace logs, containers/SIF, local workstation, server/HPC, strict/lenient profiles</text>
