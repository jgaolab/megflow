name: MEGFlow validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextflow-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Nextflow 24.10.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/megflow-bin"
          cd "$RUNNER_TEMP/megflow-bin"
          NXF_VER=24.10.3 bash -c 'curl -fsSL https://get.nextflow.io | bash'
          ./nextflow -version

      - name: Run core routing and configuration tests
        env:
          MEGFLOW_NEXTFLOW: ${{ runner.temp }}/megflow-bin/nextflow
          NXF_ANSI_LOG: "false"
          NXF_VER: 24.10.3
        run: bash scripts/validation/run_validation.sh routing-ci

  scientific-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements_validation.txt

      - name: Install scientific validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_validation.txt
          python -m pip install --no-deps -e ./megflow/tools/osl-ephys

      - name: Run real MNE and OSL scientific contracts
        run: bash scripts/validation/run_validation.sh scientific

  linux-installer:
    name: Linux installer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Linux installer contracts
        run: >-
          python scripts/validation/run_unittest_gate.py
          test_install_scripts.InstallerMetadataContractTests
          test_install_scripts.LinuxInstallerContractTests

  macos-installer:
    name: macOS installer contracts
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate macOS installer contracts
        run: >-
          python scripts/validation/run_unittest_gate.py
          test_install_scripts.MacOSInstallerContractTests

  windows-installer:
    name: Windows installer contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Parse the Windows installer with PowerShell
        run: python scripts/validation/validate_windows_installer.py

      - name: Validate Windows installer contracts
        run: >-
          python scripts/validation/run_unittest_gate.py
          test_install_scripts.WindowsInstallerContractTests

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_doc.txt

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
